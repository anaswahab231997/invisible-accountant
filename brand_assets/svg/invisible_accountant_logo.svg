<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%" fill="none">
  <rect width="600" height="120" fill="none"/>
  <rect x="6" y="6" width="588" height="108" stroke="none"/>
  <rect x="9" y="9" width="582" height="102" stroke="none"/>

  <!-- Left Emblem: The Sovereign Monoline Ledger (Scaled: 80x80 at x=20, y=20) -->
  <g transform="translate(20, 20)">
    <rect width="80" height="80" fill="none"/>
    <rect x="3" y="3" width="74" height="74" stroke="none"/>
    
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Pillar I -->
      <line x1="23" y1="19" x2="23" y2="61"/>
      <line x1="18" y1="19" x2="28" y2="19"/>
      <line x1="18" y1="61" x2="28" y2="61"/>

      <!-- Chevron A -->
      <line x1="48" y1="19" x2="34" y2="61"/>
      <line x1="48" y1="19" x2="57" y2="61"/>
      <line x1="30" y1="61" x2="38" y2="61"/>
      <line x1="53" y1="61" x2="61" y2="61"/>
      <line x1="44" y1="19" x2="52" y2="19"/>
    </g>

    <!-- Golden Section Crossbar -->
    <line x1="23" y1="40" x2="57" y2="40" stroke="#25D366" stroke-width="1.5" stroke-linecap="square"/>
    <rect x="37" y="39" width="2" height="2" fill="#1F2937"/>
  </g>

  <!-- Divider Hairline -->
  <line x1="120" y1="24" x2="120" y2="96" stroke="none"/>

  <!-- Wordmark Lockup -->
  <g transform="translate(142, 34)">
    <!-- Regulatory Status Micro-Bar -->
    <text x="0" y="0" font-family="'Geist Mono', 'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="0.24em" fill="#1A56DB">
      HMRC MAKING TAX DIGITAL 2026 · STATUTORY COMPLIANCE
    </text>

    <!-- Primary Title -->
    <text x="0" y="32" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="0.12em" fill="#1F2937">
      INVISIBLE ACCOUNTANT
    </text>

    <!-- Subtitle Footnote -->
    <text x="0" y="56" font-family="'Geist Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="400" letter-spacing="0.18em" fill="#4B5563">
      LONDON FINANCIAL DISTRICT · SEIS / EIS ADVANCE ASSURANCE
    </text>
  </g>

  <!-- Right Quality Mark / Hallmarked Plaque -->
  <g transform="translate(520, 44)">
    <rect x="0" y="0" width="56" height="32" stroke="none" fill="none"/>
    <text x="28" y="14" font-family="'Geist Mono', monospace" font-size="6.5" font-weight="600" letter-spacing="0.16em" fill="#1A56DB" text-anchor="middle">
      MTD 2026
    </text>
    <text x="28" y="24" font-family="'Geist Mono', monospace" font-size="6.5" font-weight="500" letter-spacing="0.1em" fill="#4B5563" text-anchor="middle">
      AUDITED
    </text>
  </g>
</svg>