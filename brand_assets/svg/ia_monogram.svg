<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <rect width="128" height="128" rx="16" fill="#1A56DB"/>
  <rect x="6" y="6" width="116" height="116" stroke="none"/>
  <rect x="9" y="9" width="110" height="110" stroke="none"/>

  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Pillar I (x=37, y=30..98) -->
    <line x1="37" y1="30" x2="37" y2="98"/>
    <line x1="29" y1="30" x2="45" y2="30"/>
    <line x1="29" y1="98" x2="45" y2="98"/>

    <!-- Chevron A (Apex 77, 30; Left 54, 98; Right 91, 98) -->
    <line x1="77" y1="30" x2="54" y2="98"/>
    <line x1="77" y1="30" x2="91" y2="98"/>
    <line x1="48" y1="98" x2="60" y2="98"/>
    <line x1="85" y1="98" x2="97" y2="98"/>
    <line x1="71" y1="30" x2="83" y2="30"/>
  </g>

  <!-- Golden Section Crossbar -->
  <line x1="37" y1="64" x2="91" y2="64" stroke="#25D366" stroke-width="2" stroke-linecap="square"/>
  <rect x="59" y="63" width="2.5" height="2.5" fill="#1F2937"/>
</svg>