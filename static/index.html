<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Accountant - WhatsApp Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-bg { background-color: #e5ddd5; }
        .msg-sent { background-color: #dcf8c6; }
        .msg-received { background-color: #ffffff; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-[80vh]">
    <!-- Header -->
    <div class="bg-green-600 text-white p-4 flex items-center shadow-md">
        <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-xl font-bold mr-3 overflow-hidden">
            <img src="https://i.pravatar.cc/150?img=47" alt="Emma" class="w-full h-full object-cover">
        </div>
        <div>
            <h1 class="font-bold text-lg">Emma (Invisible Accountant)</h1>
            <p class="text-xs text-green-200">Online</p>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chat-box" class="flex-1 chat-bg p-4 overflow-y-auto flex flex-col space-y-3">
        <div class="self-start msg-received px-4 py-2 rounded-lg shadow-sm max-w-[80%] text-sm">
            Hi! I'm Emma, your Invisible Accountant. 👋 Just text me your business expenses or snap a picture of your receipts, and I'll make sure they are perfectly sorted for HMRC!
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-gray-100 p-3 flex items-center">
        <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-4 py-2 rounded-full border-none focus:ring-2 focus:ring-green-500 shadow-sm outline-none">
        <button id="send-btn" class="ml-3 bg-green-500 hover:bg-green-600 text-white rounded-full p-2 h-10 w-10 flex items-center justify-center shadow-md transition-colors">
            ➤
        </button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    let turnCount = 1;

    function addMessage(text, isSent) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `px-4 py-2 rounded-lg shadow-sm max-w-[80%] text-sm ${isSent ? 'self-end msg-sent' : 'self-start msg-received'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        
        addMessage(text, true);
        msgInput.value = '';
        
        // Show typing indicator
        const typingId = "typing-" + Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.id = typingId;
        typingDiv.className = "self-start msg-received px-4 py-2 rounded-lg shadow-sm max-w-[80%] text-sm italic text-gray-500";
        typingDiv.innerText = "typing...";
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // In our prototype, webhook returns 200 OK instantly and processes async.
            // But to simulate WhatsApp, we will also fetch the queued status to show the result.
            const response = await fetch('/webhook/whatsapp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender_id: 'user_local_tester',
                    message: text,
                    turn_count: turnCount
                })
            });
            
            // To show the result, we poll the queue endpoint (since the LLM processes in background)
            setTimeout(async () => {
                document.getElementById(typingId).remove();
                
                // Fetch the latest queue to see how the AI categorized it
                const qRes = await fetch('/queue');
                const qData = await qRes.json();
                
                if (qData.queue && qData.queue.length > 0) {
                    const latest = qData.queue[qData.queue.length - 1]; // Assume last is newest for prototype UI
                    if (latest.is_ambiguous) {
                        // Use the AI generated question from the database if available, otherwise fallback
                        const question = latest.status === "DISAMBIGUATING" ? (latest.auditor_question || "Could you clarify if this was for business? 🤔") : "Could you clarify if this was for business? 🤔";
                        
                        addMessage(question, false);
                        turnCount++;
                    } else {
                        addMessage(`✅ All sorted! I've logged £${latest.amount} at ${latest.vendor} under '${latest.category}'.`, false);
                        turnCount = 1; // reset on success
                    }
                } else {
                     addMessage(`Processing...`, false);
                }
            }, 3500);

        } catch (err) {
            document.getElementById(typingId).remove();
            addMessage("Error: Could not connect to the server.", false);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
