<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invisible Accountant - Review Queue{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"DM Sans"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ukblue: '#1A56DB',
                        charcoal: '#1F2937',
                        slate: '#4B5563',
                        ukgray: '#f3f4f6',
                    }
                }
            }
        }
    </script>
    <script>
        // Ensure HTMX includes credentials (cookies) in all AJAX requests
        if (typeof htmx !== 'undefined') {
            htmx.config.withCredentials = true;
        }
        document.addEventListener('htmx:configRequest', function (evt) {
            evt.detail.credentials = 'same-origin';
        });
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 antialiased selection:bg-ukblue selection:text-white" hx-boost="false">
    <div class="min-h-screen flex flex-col">
        <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 flex items-center space-x-2">
                            <a href="/" class="block" title="Invisible Accountant Homepage">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" class="h-8 w-auto" fill="none">
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="16" fill="#F3F6FD"/>
    <rect x="3" y="3" width="74" height="74" rx="12" stroke="#BFDBFE" stroke-width="1.5"/>
    <g transform="translate(12, 12) scale(0.8)">
      <g stroke="#1D70B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="25" y1="15" x2="25" y2="55"/><line x1="18" y1="15" x2="32" y2="15"/><line x1="18" y1="55" x2="32" y2="55"/>
        <line x1="50" y1="15" x2="35" y2="55"/><line x1="50" y1="15" x2="65" y2="55"/><line x1="28" y1="55" x2="42" y2="55"/>
        <line x1="58" y1="55" x2="72" y2="55"/><line x1="43" y1="15" x2="57" y2="15"/>
      </g>
      <line x1="23" y1="35" x2="62" y2="35" stroke="#25D366" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="42.5" cy="35" r="2.5" fill="#1D70B8"/>
    </g>
  </g>
  <text x="110" y="58" font-family="'DM Sans', 'Cabinet Grotesk', -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em" fill="#0F172A">
    Invisible Accountant
  </text>
</svg>
                            </a>
                        </div>
                        <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                            {% block nav_links %}
                            <a href="/dashboard" class="border-ukblue text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-semibold">Review Queue</a>
                            {% endblock %}
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        {% block nav_actions %}
                        <div class="hidden sm:flex items-center text-xs text-gray-500 bg-gray-50 border border-gray-200 px-2.5 py-1 rounded-md">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                            <span class="font-medium text-gray-700">Practice Session Active</span>
                        </div>
                        <a href="/dashboard/logout" class="inline-flex items-center text-xs font-semibold text-gray-700 hover:text-red-700 px-3 py-1.5 rounded-lg border border-gray-200 hover:border-red-300 bg-white hover:bg-red-50/50 shadow-sm transition-colors gap-1.5" title="Sign out of Accountant Portal">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gray-500 hover:text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>Sign Out</span>
                        </a>
                        {% endblock %}
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 w-full max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>
        
        <footer class="bg-white border-t border-gray-200 mt-auto">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                <p class="text-sm text-gray-500">Built for UK Accountants.</p>
                <div class="flex space-x-4 text-sm text-gray-400">
                    <span>Xero Partner</span>
                    <span>HMRC MTD Ready</span>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
