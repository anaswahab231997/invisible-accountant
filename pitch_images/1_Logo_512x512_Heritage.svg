<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Background: Deep Oxford Slate Foundation -->
  <rect width="512" height="512" fill="#0B0F19"/>
  
  <!-- Neoclassical Architectural Double Hairline Border -->
  <rect x="20" y="20" width="472" height="472" stroke="#1E293B" stroke-width="1.5" fill="none"/>
  <rect x="30" y="30" width="452" height="452" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.65" fill="none"/>
  
  <!-- Classical Corner Registration Marks (Bank of England Drafting Grid) -->
  <line x1="24" y1="30" x2="42" y2="30" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="30" y1="24" x2="30" y2="42" stroke="#D4AF37" stroke-width="1.5"/>
  
  <line x1="470" y1="30" x2="488" y2="30" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="482" y1="24" x2="482" y2="42" stroke="#D4AF37" stroke-width="1.5"/>
  
  <line x1="24" y1="482" x2="42" y2="482" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="30" y1="470" x2="30" y2="488" stroke="#D4AF37" stroke-width="1.5"/>
  
  <line x1="470" y1="482" x2="488" y2="482" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="482" y1="470" x2="482" y2="488" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Subtle Radial Ambient Lighting behind Crest -->
  <radialGradient id="crestGlow" cx="50%" cy="46%" r="42%">
    <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="235" r="185" fill="url(#crestGlow)"/>

  <!-- Sovereign Monoline Ledger Crest (Interlocking IA Monogram) -->
  <g transform="translate(86, 65) scale(2.125)">
    <!-- Monoline Structure in Pure High-Contrast White -->
    <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Pillar I: Stately Upright (x=46, y=38..122) -->
      <line x1="46" y1="38" x2="46" y2="122"/>
      <!-- Classical Plinths & Capital Terminals -->
      <line x1="34" y1="38" x2="58" y2="38"/>
      <line x1="34" y1="122" x2="58" y2="122"/>

      <!-- Chevron A: Authority & Balance (Apex 96, 38) -->
      <line x1="96" y1="38" x2="68" y2="122"/>
      <line x1="96" y1="38" x2="114" y2="122"/>
      
      <!-- Plinths on Chevron A -->
      <line x1="58" y1="122" x2="78" y2="122"/>
      <line x1="104" y1="122" x2="124" y2="122"/>
      <line x1="86" y1="38" x2="106" y2="38"/>
    </g>

    <!-- Golden Section Ledger Beam: Hallmarked Guildhall Gilt (#D4AF37) -->
    <line x1="46" y1="80" x2="114" y2="80" stroke="#D4AF37" stroke-width="3" stroke-linecap="square"/>

    <!-- Central Trust Anchor: Heritage Royal Blue (#1D4ED8) with fine Gilt Collar -->
    <rect x="73" y="77" width="6" height="6" fill="#1D4ED8" stroke="#D4AF37" stroke-width="1"/>
  </g>
  
  <!-- Institutional Telemetry Typography -->
  <text x="256" y="426" font-family="'DM Sans', 'Cabinet Grotesk', 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.25em" fill="#FFFFFF" text-anchor="middle">INVISIBLE ACCOUNTANT</text>
  <text x="256" y="448" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#D4AF37" text-anchor="middle">CITY OF LONDON · SOVEREIGN LEDGER</text>
</svg>