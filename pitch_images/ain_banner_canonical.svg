      <rect x="6" y="6" width="148" height="148" rx="22" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>
      <path d="M 44 42 L 60 42 L 60 118 L 44 118 Z" fill="url(#bannerHeritageGrad)"/>
      <circle cx="52" cy="32" r="5.5" fill="url(#bannerGoldGrad)"/>
      <path d="M 74 118 L 100 42 L 116 42 L 142 118 L 122 118 L 113 86 L 91 86 L 82 118 Z" fill="url(#bannerHeritageGrad)"/>
      <polygon points="102,60 94,80 110,80" fill="#0F172A"/>
      <circle cx="102" cy="72" r="3.5" fill="url(#bannerGoldGrad)"/>
      <path d="M 128 132 L 138 132 L 138 142" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="138" cy="132" r="2" fill="#10B981"/>
    </g>

    <g transform="translate(187, 230)" text-anchor="middle">
      <text x="0" y="0" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.22em">THE INVISIBLE LEDGER</text>
      <text x="0" y="18" font-family="'Segoe UI Mono', monospace" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0.25em">CITY OF LONDON • EST. 2026</text>
    </g>

    <line x1="38" y1="266" x2="336" y2="266" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <g transform="translate(24, 284)">
      <rect x="0" y="0" width="98" height="24" rx="3" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="49" y="15" font-family="'Segoe UI Mono', monospace" font-size="8.5" fill="#94A3B8" letter-spacing="0.1em" text-anchor="middle">RESTful API</text>
      <rect x="110" y="0" width="108" height="24" rx="3" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="164" y="15" font-family="'Segoe UI Mono', monospace" font-size="8.5" fill="#94A3B8" letter-spacing="0.1em" text-anchor="middle">HMAC-SHA256</text>
      <rect x="230" y="0" width="96" height="24" rx="3" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="278" y="15" font-family="'Segoe UI Mono', monospace" font-size="8.5" font-weight="600" fill="#10B981" letter-spacing="0.1em" text-anchor="middle">MTD LINKED</text>
    </g>

    <text x="187" y="340" font-family="'Segoe UI Mono', monospace" font-size="8" fill="#64748B" letter-spacing="0.14em" text-anchor="middle">
