  <!-- Right Column: Sovereign Brand Sanctuary (40%) -->
  <g transform="translate(660, 36)">
    <rect x="0" y="0" width="374" height="378" rx="6" fill="#0A0F1D" stroke="rgba(29, 78, 216, 0.4)" stroke-width="1"/>
    <rect x="8" y="8" width="358" height="362" rx="4" fill="none" stroke="rgba(212, 175, 55, 0.22)" stroke-width="1" stroke-dasharray="6 3"/>
    <path d="M 14 24 L 24 24 M 24 14 L 24 24" stroke="#D4AF37" stroke-width="1"/>
    <path d="M 360 24 L 350 24 M 350 14 L 350 24" stroke="#D4AF37" stroke-width="1"/>
    <path d="M 14 354 L 24 354 M 24 364 L 24 354" stroke="#D4AF37" stroke-width="1"/>
    <path d="M 360 354 L 350 354 M 350 364 L 350 354" stroke="#D4AF37" stroke-width="1"/>

