      <line x1="170" y1="-4" x2="170" y2="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

      <g transform="translate(195, 0)">
        <text x="0" y="0" font-family="'Segoe UI Mono', monospace" font-size="9" font-weight="500" letter-spacing="0.18em" fill="#64748B">MARKET CAPACITY</text>
        <text x="0" y="20" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3.2M Sole Traders</text>
        <text x="0" y="35" font-family="'Segoe UI Mono', monospace" font-size="9" fill="#94A3B8">££49 Base + £9/mo Wholesale Model</text>
      </g>
      <line x1="365" y1="-4" x2="365" y2="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

