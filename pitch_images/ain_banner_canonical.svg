      <circle cx="14" cy="14" r="4" fill="#10B981"/>
      <circle cx="14" cy="14" r="7" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="28" y="18" font-family="'Segoe UI Mono', 'Courier New', monospace" font-size="10" font-weight="600" letter-spacing="0.16em" fill="#10B981">
        HMRC MTD 2026 • STATUTORY ARCHITECTURE
      </text>
    </g>

    <g transform="translate(0, 68)">
      <text x="0" y="38" font-family="'DM Sans', 'Cabinet Grotesk', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="0.14em" fill="#FFFFFF">
