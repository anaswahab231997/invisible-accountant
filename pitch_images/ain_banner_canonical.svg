        <text x="0" y="0" font-family="'Segoe UI Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.18em" fill="#D4AF37">VENTURE ROUND</text>
        <text x="0" y="20" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FDE68A">£350,000</text>
        <text x="0" y="35" font-family="'Segoe UI Mono', monospace" font-size="9" font-weight="600" fill="#D4AF37">50% SEIS Eligible ⚖</text>
      </g>
    </g>
