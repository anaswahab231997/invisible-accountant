    </filter>
  </defs>

  <!-- Foundation Oxford Blue with Architectural Cadastre Grid -->
  <rect width="1080" height="450" fill="#0F172A"/>
  <rect width="1080" height="450" fill="url(#archGrid)"/>
  <circle cx="850" cy="225" r="320" fill="url(#bannerSanctuaryGlow)"/>

  <!-- Sovereign Hairline Frames & Corner Cadastre Brackets -->
  <rect x="14" y="14" width="1052" height="422" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <rect x="22" y="22" width="1036" height="406" rx="2" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
  <path d="M 18 28 L 28 28 M 28 18 L 28 28" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 1062 28 L 1052 28 M 1052 18 L 1052 28" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 18 422 L 28 422 M 28 432 L 28 422" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 1062 422 L 1052 422 M 1052 432 L 1052 422" stroke="#D4AF37" stroke-width="1.5"/>

