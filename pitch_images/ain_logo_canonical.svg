<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="logoHeritageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <radialGradient id="logoAmbientGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="logoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Foundation Canvas -->
  <rect width="512" height="512" rx="64" fill="#0F172A"/>
  <rect width="512" height="512" rx="64" fill="url(#logoGrid)"/>
  <circle cx="256" cy="230" r="180" fill="url(#logoAmbientGlow)"/>

  <!-- Architectural Borders -->
  <rect x="20" y="20" width="472" height="472" rx="48" fill="none" stroke="rgba(29, 78, 216, 0.4)" stroke-width="1.5"/>
  <rect x="30" y="30" width="452" height="452" rx="40" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>

  <!-- Cadastre Corner Marks -->
  <path d="M 26 36 L 36 36 M 36 26 L 36 36" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 486 36 L 476 36 M 476 26 L 476 36" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 26 476 L 36 476 M 36 486 L 36 476" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 486 476 L 476 476 M 476 486 L 476 476" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Sovereign Monoline Ledger Crest Geometry -->
  <g transform="translate(0, 0)">
    <!-- Pillar 'I' -->
    <path d="M 152 140 L 188 140 L 188 310 L 152 310 Z" fill="url(#logoHeritageGrad)"/>
    <circle cx="170" cy="115" r="12" fill="url(#logoGoldGrad)"/>

    <!-- Chevron 'A' -->
    <path d="M 215 310 L 275 140 L 315 140 L 375 310 L 338 310 L 320 250 L 270 250 L 252 310 Z" fill="url(#logoHeritageGrad)"/>

    <!-- The Invisible Ledger Aperture Cutout -->
    <polygon points="295,175 278,225 312,225" fill="#0F172A"/>

    <!-- Gilt Ledger Balance Pivot -->
    <circle cx="295" cy="208" r="7" fill="url(#logoGoldGrad)"/>

    <!-- Treasury Emerald Audit Hallmark -->
    <path d="M 355 320 L 368 320 L 368 333" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typographic Lockup Base -->
  <line x1="80" y1="368" x2="432" y2="368" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <text x="256" y="408" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="700" letter-spacing="0.22em" fill="#FFFFFF" text-anchor="middle">
    INVISIBLE ACCOUNTANT
  </text>
  <text x="256" y="436" font-family="'Segoe UI Mono', monospace" font-size="10" font-weight="500" letter-spacing="0.26em" fill="#94A3B8" text-anchor="middle">
    HMRC MAKING TAX DIGITAL • CITY OF LONDON
  </text>
  <circle cx="256" cy="460" r="3.5" fill="#10B981"/>
</svg>