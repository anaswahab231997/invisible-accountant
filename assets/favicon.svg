<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Solid background, no thin borders to prevent blur at 16x16 -->
  <rect width="32" height="32" rx="8" fill="#1D70B8"/>
  
  <!-- Extremely thick, high-contrast strokes for micro-legibility -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pillar I -->
    <line x1="10" y1="8" x2="10" y2="24"/>
    <line x1="6" y1="8" x2="14" y2="8"/>
    <line x1="6" y1="24" x2="14" y2="24"/>

    <!-- Chevron A -->
    <line x1="22" y1="8" x2="16" y2="24"/>
    <line x1="22" y1="8" x2="28" y2="24"/>
  </g>

  <!-- Massive Success Green Crossbar for the A -->
  <line x1="15" y1="18" x2="29" y2="18" stroke="#25D366" stroke-width="3.5" stroke-linecap="round"/>
</svg>
