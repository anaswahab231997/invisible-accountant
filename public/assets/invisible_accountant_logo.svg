<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%" fill="none">
  <!-- 1. The Accepted Crest (Scaled to 80x80 for balance with text) -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="16" fill="#F3F6FD"/>
    <rect x="3" y="3" width="74" height="74" rx="12" stroke="#BFDBFE" stroke-width="1.5"/>
    
    <g transform="translate(12, 12) scale(0.8)">
      <g stroke="#1D70B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="25" y1="15" x2="25" y2="55"/>
        <line x1="18" y1="15" x2="32" y2="15"/>
        <line x1="18" y1="55" x2="32" y2="55"/>
        <line x1="50" y1="15" x2="35" y2="55"/>
        <line x1="50" y1="15" x2="65" y2="55"/>
        <line x1="28" y1="55" x2="42" y2="55"/>
        <line x1="58" y1="55" x2="72" y2="55"/>
        <line x1="43" y1="15" x2="57" y2="15"/>
      </g>
      <!-- Success Green Crossbar -->
      <line x1="23" y1="35" x2="62" y2="35" stroke="#25D366" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="42.5" cy="35" r="2.5" fill="#1D70B8"/>
    </g>
  </g>

  <!-- 2. Clean Wordmark (No extra overlays, borders, or micro-text) -->
  <!-- Using Deep Slate (#0F172A) to match the psychological palette -->
  <text x="110" y="58" font-family="'DM Sans', 'Cabinet Grotesk', -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.02em" fill="#0F172A">
    Invisible Accountant
  </text>
</svg>