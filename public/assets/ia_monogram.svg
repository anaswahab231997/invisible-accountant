<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Minimalist, high-whitespace background -->
  <rect width="120" height="120" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <g transform="translate(25, 25)">
    <!-- HMRC Trust Blue and WhatsApp Green mapping -->
    <g stroke="#1D70B8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pillar I -->
      <line x1="25" y1="15" x2="25" y2="55"/>
      <line x1="15" y1="15" x2="35" y2="15"/>
      <line x1="15" y1="55" x2="35" y2="55"/>

      <!-- Chevron A -->
      <line x1="50" y1="15" x2="35" y2="55"/>
      <line x1="50" y1="15" x2="65" y2="55"/>
      <line x1="28" y1="55" x2="42" y2="55"/>
      <line x1="58" y1="55" x2="72" y2="55"/>
      <line x1="43" y1="15" x2="57" y2="15"/>
    </g>

    <!-- Success Green Accent -->
    <line x1="23" y1="35" x2="62" y2="35" stroke="#25D366" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="42.5" cy="35" r="3" fill="#1D70B8"/>
  </g>
</svg>